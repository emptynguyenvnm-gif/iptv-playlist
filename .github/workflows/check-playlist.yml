```yaml
name: Check IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: playlist-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download playlist
        uses: actions/checkout@v4

      - name: Check stream URLs
        run: |
          python - <<'PY'
          import concurrent.futures
          import os
          import urllib.request
          import urllib.error
          from urllib.parse import urlsplit

          filename = "playlist.m3u"

          if not os.path.isfile(filename):
              raise SystemExit(
                  "ERROR: Khong tim thay playlist.m3u trong thu muc goc."
              )

          entries = []
          referer = None

          with open(filename, encoding="utf-8-sig") as f:
              for line_no, raw in enumerate(f, 1):
                  line = raw.strip()

                  if line.startswith("#EXTVLCOPT:http-referrer="):
                      referer = line.split("=", 1)[1].strip()
                      continue

                  if not line or line.startswith("#"):
                      continue

                  if line.startswith(("http://", "https://")):
                      entries.append((line_no, line, referer))
                      referer = None

          if not entries:
              raise SystemExit(
                  "ERROR: Khong tim thay URL HTTP/HTTPS trong playlist."
              )

          unique = {}
          for entry in entries:
              unique.setdefault(entry[1], entry)

          def check(entry):
              line_no, url, ref = entry
              headers = {
                  "User-Agent": "Mozilla/5.0 PlaylistMonitor/1.0",
                  "Range": "bytes=0-0",
              }

              if ref:
                  headers["Referer"] = ref

              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=6) as response:
                      status = response.status

                  ok = 200 <= status < 400
                  return line_no, url, str(status), ok

              except urllib.error.HTTPError as e:
                  return line_no, url, str(e.code), False

              except Exception as e:
                  return line_no, url, type(e).__name__, False

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=20
          ) as pool:
              results = list(pool.map(check, unique.values()))

          failed = [r for r in results if not r[3]]
          summary = os.environ["GITHUB_STEP_SUMMARY"]

          def safe_url(url):
              p = urlsplit(url)
              return f"{p.scheme}://{p.netloc}{p.path}"

          with open(summary, "a", encoding="utf-8") as out:
              out.write("# IPTV playlist check\n\n")
              out.write(f"- Unique URLs checked: {len(results)}\n")
              out.write(f"- URLs needing review: {len(failed)}\n\n")

              if failed:
                  out.write("| Playlist line | URL | Result |\n")
                  out.write("|---:|---|---|\n")

                  for line_no, url, result, _ in failed:
                      out.write(
                          f"| {line_no} | `{safe_url(url)}` "
                          f"| {result} |\n"
                      )
              else:
                  out.write("No URL errors detected.\n")

          print(
              f"Checked {len(results)} unique URLs; "
              f"{len(failed)} need review."
          )

          if failed:
              raise SystemExit(1)
          PY
```
